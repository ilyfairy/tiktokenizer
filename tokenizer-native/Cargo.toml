[package]
name = "tiktokenizer-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
tiktoken = { path = "vendor/tiktoken", default-features = false }
wasm-bindgen = "=0.2.104"

[features]
default = []
openai-claude = ["tiktoken/vocab-openai", "tiktoken/vocab-claude_legacy"]
deepseek = ["tiktoken/vocab-deepseek"]
qwen = ["tiktoken/vocab-qwen"]
meta = ["tiktoken/vocab-meta"]
mistral = ["tiktoken/vocab-mistral"]
moonshot = ["tiktoken/vocab-moonshot"]
zhipu = ["tiktoken/vocab-zhipu"]
minimax = ["tiktoken/vocab-minimax"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
